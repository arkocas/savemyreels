    <script>
    // Remove GSC hash from URL
    window.addEventListener('hashchange', function() {
        if (window.location.hash.startsWith('#gsc')) {
            history.replaceState(null, '', window.location.pathname + window.location.search);
        }
    });
    // Also clean on load
    if (window.location.hash.startsWith('#gsc')) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    
    // Platform Toggle Logic
    const urlParams = new URLSearchParams(window.location.search);
    window.currentPlatform = urlParams.get('platform') === 'tiktok' ? 'tiktok' : 'instagram';
    
    // Inject correct CSE script
    const cseScript = document.createElement('script');
    cseScript.async = true;
    if (window.currentPlatform === 'tiktok') {
        cseScript.src = "https://cse.google.com/cse.js?cx=724dfb279e7194ea1";
        document.getElementById('search-container').innerHTML = '<div class="gcse-search"></div>';
    } else {
        cseScript.src = "https://cse.google.com/cse.js?cx=511550904bb1e4628";
        document.getElementById('search-container').innerHTML = '<div class="gcse-search"></div>';
    }
    document.head.appendChild(cseScript);

    // Update UI based on current platform
    document.getElementById('tab-instagram').classList.toggle('active', window.currentPlatform === 'instagram');
    document.getElementById('tab-tiktok').classList.toggle('active', window.currentPlatform === 'tiktok');
    
    const urlInput = document.getElementById('reel-url');
    if (window.currentPlatform === 'instagram') {
        urlInput.placeholder = "https://www.instagram.com/reel/...";
    } else {
        urlInput.placeholder = "https://www.tiktok.com/@user/video/...";
    }

    document.getElementById('tab-instagram').addEventListener('click', () => setPlatform('instagram'));
    document.getElementById('tab-tiktok').addEventListener('click', () => setPlatform('tiktok'));

    function setPlatform(platform) {
        if (platform !== window.currentPlatform) {
            window.location.href = window.location.pathname + '?platform=' + platform;
        }
    }
    </script>
    <script>
    // Helper to get translation for current language
    function getTranslation(key) {
        if (typeof translations === 'undefined' || typeof detectLanguage === 'undefined') return null;
        const lang = detectLanguage();
        return translations[lang] && translations[lang][key] ? translations[lang][key] : (translations['en'] && translations['en'][key]) || null;
    }

    // Remove Google branding from autocomplete
    const observer = new MutationObserver(function(mutations) {
        // Remove branding
        document.querySelectorAll('.gsc-completion-container img[src*="branding"]').forEach(function(img) {
            const row = img.closest('tr');
            if (row) row.style.display = 'none';
        });

        // Force overlay results to be inline by moving them
        const overlay = document.querySelector('.gsc-results-wrapper-overlay, .gsc-results-wrapper-visible');
        if (overlay) {
            // Move overlay into search section so it flows normally
            const searchSection = document.querySelector('.search-section');
            if (searchSection && !searchSection.contains(overlay)) {
                searchSection.appendChild(overlay);
            }
        }

        // Track search queries and intercept URLs
        const searchInput = document.querySelector('input.gsc-input');
        if (searchInput) {
            // Track queries
            if (searchInput.value) {
                const query = searchInput.value.trim();
                if (query && document.querySelector('.gsc-webResult') && searchInput.dataset.lastTracked !== query) {
                    searchInput.dataset.lastTracked = query;
                    fetch('/api/track-search', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            query: query,
                            platform: window.currentPlatform || 'instagram'
                        })
                    }).catch(() => {});
                }
            }

            // Intercept Instagram URLs
            if (!searchInput.dataset.urlListener) {
                searchInput.dataset.urlListener = 'true';
                
                const warningEl = document.createElement('div');
                warningEl.className = 'search-url-warning hidden';
                warningEl.style.color = '#e11d48';
                warningEl.style.fontSize = '0.85rem';
                warningEl.style.marginTop = '-0.5rem';
                warningEl.style.marginBottom = '1rem';
                warningEl.style.textAlign = 'center';
                warningEl.style.fontWeight = '600';
                
                const getWarningText = () => {
                    const lang = (typeof detectLanguage === 'function') ? detectLanguage() : 'en';
                    const texts = {
                        en: '👇 To download this Reel, paste the link in the download box below.',
                        tr: '👇 Bu Reel\'i indirmek için linki aşağıdaki indirme kutusuna yapıştırın.',
                        de: '👇 Fügen Sie den Link unten ein, um dieses Reel herunterzuladen.',
                        es: '👇 Para descargar este Reel, pega el enlace abajo.',
                        fr: '👇 Collez le lien ci-dessous pour télécharger ce Reel.',
                        pt: '👇 Para baixar este Reel, cole o link abaixo.',
                        ar: '👇 لتحميل هذا الـ Reel، الصق الرابط أدناه.',
                        hi: '👇 इस Reel को डाउनलोड करने के लिए, नीचे लिंक पेस्ट करें।'
                    };
                    return texts[lang] || texts['en'];
                };
                
                const form = searchInput.closest('form');
                if (form) form.insertAdjacentElement('afterend', warningEl);
                
                searchInput.addEventListener('input', (e) => {
                    if (e.target.value.includes('instagram.com/')) {
                        warningEl.textContent = getWarningText();
                        warningEl.classList.remove('hidden');
                    } else {
                        warningEl.classList.add('hidden');
                    }
                });
                
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && searchInput.value.includes('instagram.com/')) {
                        e.preventDefault();
                        e.stopPropagation();
                        const downInput = document.getElementById('reel-url');
                        if (downInput) {
                            downInput.value = searchInput.value;
                            searchInput.value = '';
                            warningEl.classList.add('hidden');
                            document.querySelector('.download-section').scrollIntoView({ behavior: 'smooth' });
                            
                            // Flash the download box to draw attention
                            downInput.style.transition = 'box-shadow 0.3s ease';
                            downInput.style.boxShadow = '0 0 0 4px rgba(225, 29, 72, 0.4)';
                            setTimeout(() => downInput.style.boxShadow = 'none', 1000);
                        }
                    }
                }, true); // use capture
            }
        }

        // Open result links in new tab
        document.querySelectorAll('.gsc-webResult.gsc-result a[data-ctorig]').forEach(function(link) {
            if (link.getAttribute('target') === '_blank') return;
            link.setAttribute('target', '_blank');
            link.setAttribute('rel', 'noopener noreferrer');
        });

        // Add download buttons to search results
        document.querySelectorAll('.gsc-webResult.gsc-result').forEach(function(result) {
            if (result.querySelector('.reel-download-btn')) return; // already added
            const link = result.querySelector('a[data-ctorig]');
            if (!link) return;
            const reelUrl = link.getAttribute('data-ctorig');
            
            // Check if it's Instagram or TikTok
            const isInstagram = reelUrl && reelUrl.includes('instagram.com');

            const isTikTok = reelUrl && (
                reelUrl.includes('tiktok.com') ||
                reelUrl.includes('vt.tiktok.com')
            );

            const isDiscover = reelUrl && reelUrl.includes('tiktok.com/discover/');

            const btn = document.createElement(isDiscover ? 'a' : 'button');
            btn.className = 'reel-download-btn';
            
            if (isDiscover) {
                btn.classList.add('discover-btn');
                btn.innerHTML = '🔎 Keşfet';

                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.open(reelUrl, '_blank', 'noopener,noreferrer');
                });
            } else {
                btn.innerHTML = '⬇ ' + (getTranslation('download_btn') || 'Download');

                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    const searchInputs = document.querySelectorAll('input.gsc-input');
                    let fromQuery = '';
                    searchInputs.forEach(input => {
                        if (input.value.trim()) fromQuery = input.value.trim();
                    });

                    const platform = isTikTok ? 'tiktok' : 'instagram';
                    downloadVideo(reelUrl, btn, fromQuery, platform);
                });
            }
            result.style.position = 'relative';
            result.appendChild(btn);
        });
    });
    observer.observe(document.body, { childList: true, subtree: true, attributes: true });

    // Download video from search result
    async function downloadVideo(videoUrl, btn, fromQuery, platform) {
        btn.innerHTML = '⏳ ' + (getTranslation('download_btn_loading') || 'Loading...');
        btn.disabled = true;
        try {
            const apiEndpoint = platform === 'tiktok' ? '/api/download-tiktok' : '/api/download';
            const response = await fetch(`${apiEndpoint}?url=` + encodeURIComponent(videoUrl));
            const data = await response.json();
            
            if (data.video_url) {
                // Generate filename
                let filename = platform === 'tiktok' ? 'tiktok' : 'reel';
                if (data.caption) {
                    filename = data.caption
                        .substring(0, 60)
                        .replace(/[^\w\sğüşıöçĞÜŞİÖÇ-]/g, '')
                        .replace(/\s+/g, '_')
                        .trim();
                } else if (data.owner && data.owner.username) {
                    filename = data.owner.username + '_' + (data.shortcode || data.id || 'video');
                }
                if (!filename) filename = `${platform}_` + (data.shortcode || data.id || Date.now());

                const a = document.createElement('a');
                a.href = '/api/proxy-video?url=' + encodeURIComponent(data.video_url) + '&filename=' + encodeURIComponent(filename);
                a.download = filename + '.mp4';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                btn.innerHTML = '✅ ' + (getTranslation('download_btn_done') || 'Done');
                // Track download
                fetch('/api/track-download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source: 'search', query: fromQuery || '', url: videoUrl, platform: platform })
                }).catch(() => {});
            } else {
                btn.innerHTML = '❌ ' + (getTranslation('download_btn_failed') || 'Failed');
            }
        } catch (err) {
            btn.innerHTML = '❌ ' + (getTranslation('download_btn_failed') || 'Failed');
        }
        setTimeout(() => {
            btn.innerHTML = '⬇ ' + (getTranslation('download_btn') || 'Download');
            btn.disabled = false;
        }, 3000);
    }
    </script>
